name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    # HONEST changed-files gate. The repo carries ~149 pre-existing ruff
    # findings + ~138 unformatted files, so linting the whole tree would
    # false-RED every PR. Instead we lint ONLY the Python/frontend files a
    # PR actually adds or changes: new/changed code must be clean, legacy
    # debt is left for a separate cleanup. This makes the required `lint`
    # check truthful again — it used to be `ruff check --exit-zero` +
    # `format --check || true`, i.e. a required check that could never fail.
    name: lint
    runs-on: ubuntu-24.04
    # 15m headroom: the frontend leg (only when frontend files change) runs
    # `npm ci` for the Expo app, which is slow. The backend leg is fast.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history on both sides of the diff to compute changed files.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Determine changed files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            # push (non-root): diff against the previous commit.
            RANGE="HEAD~1 HEAD"
          else
            # Root commit: nothing to diff against — treat as no changes.
            RANGE=""
          fi

          if [ -n "$RANGE" ]; then
            # ACMR = added/copied/modified/renamed; excludes deletions so we
            # never hand ruff a path that no longer exists.
            ALL=$(git diff --name-only --diff-filter=ACMR $RANGE)
          else
            ALL=""
          fi

          printf '%s\n' "$ALL" | grep -E '\.py$'      > changed_py.txt || true
          printf '%s\n' "$ALL" | grep -E '^frontend/' > changed_fe.txt || true
          # Drop any empty line grep may have emitted.
          sed -i '/^$/d' changed_py.txt changed_fe.txt

          printf '%s\n' "$ALL" | grep -E '^frontend/services/auth\.ts$|^frontend/hooks/useAuth\.tsx$' > changed_auth.txt || true
          sed -i '/^$/d' changed_auth.txt

          echo "── changed Python files ──"; cat changed_py.txt || true
          echo "── changed frontend files ──"; cat changed_fe.txt || true
          echo "── changed auth files ──"; cat changed_auth.txt || true
          echo "fe_count=$(wc -l < changed_fe.txt)" >> "$GITHUB_OUTPUT"
          echo "auth_count=$(wc -l < changed_auth.txt)" >> "$GITHUB_OUTPUT"

      - name: Ruff lint + format (changed Python only)
        run: |
          set -euo pipefail
          if [ ! -s changed_py.txt ]; then
            echo "No changed Python files — skipping ruff."
            exit 0
          fi
          # GUARD: only ever call ruff with an explicit, non-empty file list.
          # Bare `ruff check` would lint the whole legacy tree and false-red.
          mapfile -t FILES < changed_py.txt
          echo "Linting ${#FILES[@]} changed Python file(s):"
          printf '  %s\n' "${FILES[@]}"
          # Pin ruff so the required `lint` check is deterministic: `uvx ruff`
          # is otherwise unpinned and ruff's default rule set drifts between
          # releases (a fresh runner started flagging PL/SIM/RUF rules), which
          # made back-to-back runs of the same PR report different errors. The
          # rule set itself is pinned in ./ruff.toml.
          uvx ruff@0.15.22 check "${FILES[@]}"
          uvx ruff@0.15.22 format --check "${FILES[@]}"

      - name: Frontend lint (only when frontend files changed)
        if: steps.changed.outputs.fe_count != '0'
        env:
          CI: "true" # keep `expo lint` non-interactive (no setup prompts)
        run: |
          set -euo pipefail
          echo "Frontend files changed — running frontend lint."
          cd frontend
          npm ci
          # expo lint / eslint flat-config lints the whole frontend project;
          # it is not reliably scopeable to a file list via the expo wrapper.
          # Currently green on main (warnings only, which eslint does not fail
          # on); this gate fails only on new eslint ERRORS in frontend PRs.
          npm run lint

      - name: Sign-in unit tests (only when auth files changed)
        if: steps.changed.outputs.auth_count != '0'
        run: |
          set -euo pipefail
          echo "Auth files changed — running sign-in unit tests."
          cd frontend
          if [ ! -d node_modules ]; then npm ci; fi
          npm run test:signin:unit

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Advisory: surface mypy findings as a warning but NEVER fail/red the
      # check (the backend carries pre-existing type debt). Exit 0 so the job
      # is green-with-warning, mirroring the factory's own advisory mypy job.
      # `continue-on-error` was wrong here — it kept the step red on the PR/main.
      - name: mypy (advisory)
        run: |
          cd backend
          uvx mypy app > mypy.out 2>&1 || true
          tail -20 mypy.out || true
          COUNT=$(grep -c "error:" mypy.out || true)
          echo "::warning::mypy: ${COUNT} findings (advisory — tracked debt, not gating)"

  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sacrifice
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sacrifice
      JWT_SECRET: ci-test-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: cd backend && uv run --extra dev pytest -q tests/

  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sacrifice
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sacrifice
      JWT_SECRET: ci-smoke-test-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run DB migrations
        run: cd backend && uv run --extra dev alembic upgrade head
      - name: Start backend
        run: |
          cd backend
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "Backend ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy within 60s"
          exit 1
      - name: Run smoke journey
        run: SMOKE_BASE_URL=http://127.0.0.1:8000 make smoke